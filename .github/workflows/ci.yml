name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/compatibility/react*/package-lock.json

      - name: Use repository npm version
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:all

      - name: Build library and examples
        run: npm run build:examples

      - name: Typecheck
        run: npm run typecheck

      - name: Test packed package with React 18 and 19
        run: npm run test:compatibility

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Test apps in browser
        run: npm run test:browser

      - name: Test apps in Firefox
        run: npm run test:browser:firefox
